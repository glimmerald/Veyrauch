name: Build and Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Отменяем предыдущие незавершенные билды при новом пуше, чтобы не было конфликтов
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Generate static site (Nuxt SSG)
        env:
          NUXT_TELEMETRY_DISABLED: 1
          YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID || '110248286' }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID || 'G-PSR45G61DT' }}
        run: npm run generate

      - name: 🚀 Sync to Beget Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Обычно на Beget: veyrauch.ru/public_html/ или /public_html/
          server-dir: ${{ secrets.FTP_TARGET_DIR || '/' }}
          local-dir: .output/public/
          # Не удаляем все файлы перед загрузкой, чтобы сайт не падал во время деплоя
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: 🔔 Notify Yandex via IndexNow (Быстрая перепроверка)
        run: |
          echo "Отправляем сигнал в Яндекс (IndexNow) для быстрой переиндексации..."
          curl -s -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "veyrauch.ru",
              "key": "2b7e151628aed2a6abf7158809cf4f3c",
              "keyLocation": "https://veyrauch.ru/2b7e151628aed2a6abf7158809cf4f3c.txt",
              "urlList": [
                "https://veyrauch.ru/",
                "https://veyrauch.ru/sitemap.xml"
              ]
            }' || echo "Запрос IndexNow отправлен."
