name: Build and Deploy to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Отменяем предыдущие незавершенные билды при новом пуше, чтобы не было конфликтов
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Generate static site (Nuxt SSG)
        env:
          NUXT_TELEMETRY_DISABLED: 1
          YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID || '110248286' }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID || 'G-PSR45G61DT' }}
        run: npm run generate

      - name: 🔑 Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Sync to Timeweb Hosting via SSH (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          # --checksum (-c): сравнивает файлы по содержимому, а не по времени сборки,
          # поэтому крупные видеофайлы не перезаливаются заново при каждом билде.
          # --delete-delay: удаляет с сервера только те файлы, которых больше нет в сборке.
          rsync -avzc --omit-dir-times --delete-delay \
            --exclude='.git*' \
            --exclude='.DS_Store' \
            -e "ssh -4 -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" \
            .output/public/ \
            "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"

      - name: 🔔 Notify Yandex via IndexNow (Быстрая перепроверка)
        run: |
          echo "Отправляем сигнал в Яндекс (IndexNow) для быстрой переиндексации..."
          curl -s -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "veyrauch.ru",
              "key": "2b7e151628aed2a6abf7158809cf4f3c",
              "keyLocation": "https://veyrauch.ru/2b7e151628aed2a6abf7158809cf4f3c.txt",
              "urlList": [
                "https://veyrauch.ru/",
                "https://veyrauch.ru/sitemap.xml"
              ]
            }' || echo "Запрос IndexNow отправлен."
